<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer squircle container -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Subtle tech border ring -->
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Main "UG" Text with Shadow -->
  <g filter="url(#shadow)">
    <text x="256" y="325" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="240" 
          font-weight="900" 
          letter-spacing="-8"
          text-anchor="middle" 
          fill="url(#textGrad)">UG</text>
  </g>

  <!-- Power Pulse / Underground Cable Line -->
  <path d="M 120 370 L 235 370 L 255 390 L 275 350 L 295 370 L 392 370" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
